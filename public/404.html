<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found | FoodLoop AI</title>
    <meta name="robots" content="noindex" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8f5;
        color: #14231c;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 10px 40px rgba(11, 61, 46, 0.08);
      }
      .code {
        font-size: 64px;
        font-weight: 800;
        color: #0b3d2e;
        letter-spacing: -0.03em;
      }
      h1 { font-size: 22px; margin: 8px 0 12px; }
      p { color: #3c5247; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
      a.btn {
        display: inline-block;
        background: #0b3d2e;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 28px;
        border-radius: 999px;
      }
      a.btn:hover { background: #0f4f3b; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>This plate is empty</h1>
      <p>
        The page you're looking for was served to someone else. Let's get you
        back to closing the food loop.
      </p>
      <a class="btn" href="/">Back to FoodLoop AI</a>
    </main>
    <script>
      // GitHub Pages serves /404.html for ANY unmatched path, so compute the
      // deploy root at runtime (works for root and /FoodLoop-AI/ deploys).
      ;(function () {
        var parts = location.pathname.split('/')
        // '/FoodLoop-AI/foo/bar' → root '/FoodLoop-AI/' ; '/foo' → '/'
        parts.pop()
        var base = parts.join('/') + '/'
        if (base === '//') base = '/'
        document.getElementById('favicon').href = base + 'brand/favicon.svg'
        document.querySelector('a.btn').href = base

        // Standard GitHub Pages SPA handoff: remember the intended path so the
        // SPA can render the right route (or its 404 UI) after the redirect.
        try {
          var seg = '/' + location.pathname.slice(base.length).replace(/^\/+/, '')
          sessionStorage.setItem('fl-redirect', seg + location.search + location.hash)
        } catch (e) {
          /* storage unavailable — plain redirect is fine */
        }
        location.replace(base)
      })()
    </script>
  </body>
</html>
