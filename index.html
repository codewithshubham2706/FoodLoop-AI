<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary meta -->
    <title>FoodLoop AI — Predict, Prevent &amp; Redistribute Food Waste with AI</title>
    <meta
      name="description"
      content="FoodLoop AI predicts food demand and surplus, checks quality with CV + IoT sensors, matches safe surplus with nearby NGOs and optimizes delivery routes — turning kitchen waste into meals served and CO₂ saved."
    />
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="color-scheme" content="light" />
    <!-- Canonical/OG defaults; per-route values are synced by src/lib/seo.ts -->
    <link rel="canonical" href="__FL_PUBLIC_BASE__" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoodLoop AI" />
    <meta property="og:title" content="FoodLoop AI — Predict, Prevent &amp; Redistribute Food Waste with AI" />
    <meta
      property="og:description"
      content="Five connected AI engines close the loop: demand prediction, surplus detection, CV + IoT quality checks, NGO matching and route optimization."
    />
    <meta property="og:url" content="__FL_PUBLIC_BASE__" />
    <meta property="og:image" content="__FL_PUBLIC_BASE__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FoodLoop AI — closed-loop food redistribution platform" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodLoop AI — Predict, Prevent &amp; Redistribute Food Waste with AI" />
    <meta
      name="twitter:description"
      content="Five connected AI engines close the loop: demand prediction, surplus detection, CV + IoT quality checks, NGO matching and route optimization."
    />
    <meta name="twitter:image" content="__FL_PUBLIC_BASE__og-image.png" />
    <meta name="twitter:image:alt" content="FoodLoop AI — closed-loop food redistribution platform" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="__FL_BASE__brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="__FL_BASE__favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="__FL_BASE__apple-touch-icon.png" />
    <link rel="manifest" href="__FL_BASE__manifest.webmanifest" />

    <!-- Fonts (preconnected + swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FoodLoop AI",
        "url": "__FL_PUBLIC_BASE__",
        "logo": "__FL_PUBLIC_BASE__og-image.png",
        "description": "AI-powered closed-loop ecosystem that predicts food demand & surplus, detects quality deterioration via IoT + Computer Vision, matches safe surplus with nearby recipients and optimizes redistribution while measuring impact.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "hello@foodloop.ai"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      FoodLoop AI needs JavaScript to run. Please enable it, or email
      hello@foodloop.ai to join the pilot waitlist.
    </noscript>
  </body>
</html>
